version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gonax-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-gonax_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gonax_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gonax-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_change_in_prod}@postgres:5432/${POSTGRES_DB:-gonax_db}
      DATABASE_DRIVER: postgres
      JWT_SECRET: ${JWT_SECRET:-gonax_prod_secret_minimum_32_characters_random_string!}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-gonax_admin_secret_key_prod_16ch!}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      - backupdata:/app/data/backups

  frontend:
    image: node:22-alpine
    container_name: gonax-frontend
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npx -y serve -s dist -l 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  backupdata:
